name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: win
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  macos:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dmg + zip (ad-hoc signed)
        run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  release:
    name: Publish release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PicFlow v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          files: dist/**/*
          body: |
            ## PicFlow v${{ steps.ver.outputs.version }}

            ### 下载
            - **Windows**：`PicFlow-Setup-${{ steps.ver.outputs.version }}.exe`（NSIS 安装包，支持应用内自动更新）
            - **macOS**：`PicFlow-${{ steps.ver.outputs.version }}-arm64.dmg`（M 系列）/ `PicFlow-${{ steps.ver.outputs.version }}-x64.dmg`（Intel）

            ### macOS 说明
            macOS 版为 ad-hoc 签名、未公证。首次打开请**右键 App →「打开」**，或执行：

            ```bash
            xattr -cr "/Applications/PicFlow.app"
            ```

            macOS 版暂不支持应用内自动更新，新版本请从本页下载。

            完整更新记录见 [README](https://github.com/Slimeissoft/PicFlow#更新记录)。
