<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>PicFlow 图片管家</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7.5" height="7.5" rx="3"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="3"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="3"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="3"/></svg>
    </div>
    <nav id="nav"></nav>
    <button id="btn-cloud-set" class="nav-item nav-bottom" title="AI 识别设置（配置 OpenAI / Claude / DeepSeek 等大模型 API）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="lbl">AI 设置</span>
    </button>
    <button id="btn-guide" class="nav-item nav-bottom" title="使用引导">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
      <span class="lbl">引导</span>
    </button>
  </aside>

  <div id="right">
    <header id="topbar">
      <button id="btn-menu" class="icon-btn" title="收起 / 展开侧栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="crumb"></div>
      <div class="tb-spacer"></div>
      <button id="btn-multi" class="pill" title="多选模式：开启后点击图片直接选中，不再打开预览">☑ 多选</button>
      <button id="btn-nsfw" class="pill toggle-nsfw" title="循环切换：隐藏 NSFW → 显示全部 → 仅看 NSFW">● NSFW 已隐藏</button>
      <input id="search" type="text" placeholder="搜索文件名、标签、备注…">
      <span id="status-pill" class="pill">…</span>
      <button id="btn-scan" class="btn-primary">扫描文件夹</button>
    </header>
    <div id="progress" class="hidden"><div id="progress-bar"></div></div>
    <main id="content">
      <div id="view-head"></div>
      <div id="dup-root" class="hidden"></div>
      <div id="grid"></div>
      <div id="empty-state" class="hidden"></div>
    </main>
  </div>
</div>

<div id="selbar" class="hidden">
  <button id="sb-clear" class="sb-x" title="取消选择">✕</button>
  <span id="sb-count">已选 0 张</span>
  <span class="sb-sep"></span>
  <button class="chip star-chip" data-act="star">★ 星标</button>
  <button class="chip nsfw-chip" data-act="nsfw">🔞 标记 NSFW</button>
  <button class="chip" data-act="tag">标签</button>
  <button class="chip" data-act="aicat">标注分类…</button>
  <button class="chip" data-act="album">相册</button>
  <button class="chip" data-act="move">移动…</button>
  <button class="chip" data-act="rename">重命名</button>
  <button class="chip danger" data-act="trash">移出</button>
  <button class="chip hidden" data-act="unalbum">移出相册</button>
  <button class="chip hidden" data-act="revive">恢复到图库</button>
  <button class="chip hidden danger" data-act="purge">彻底删除</button>
  <button class="chip hidden" data-act="clearrec">清除记录</button>
</div>

<div id="lightbox" class="hidden">
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <aside id="lb-panel"></aside>
  <button id="lb-prev" class="lb-arrow" title="上一张 (←)">‹</button>
  <button id="lb-next" class="lb-arrow" title="下一张 (→)">›</button>
  <button id="lb-full" class="lb-full" title="全屏显示 (F 或双击图片)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
  <button id="lb-close" class="lb-close" title="关闭 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div id="lb-hint" class="lb-hint">← → 切换 · F 或双击全屏 · 点击空白关闭 · Esc 退出</div>
</div>

<div id="update-bar" class="hidden">
  <span id="ub-text">发现新版本</span>
  <div id="ub-progress"><div id="ub-progress-inner"></div></div>
  <button id="ub-action" class="ub-btn">下载更新</button>
  <button id="ub-close" class="ub-close" title="稍后再说">✕</button>
</div>

<div id="hint-bar">单击 预览 · 开启右上「多选」后点击图片直接选中 · Ctrl+A 全选 · Del 移出</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
